<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una sola targeta de taller, pensada per al mòbil (s'hi arriba amb un QR); progrés com un regle mil·limetrat */
:root{
  --bg:#EEF1F6; --paper:#FFFFFF; --ink:#14213D; --muted:#56627A; --line:#D5DBE6;
  --accent:#F2B705; --accent-ink:#14213D; --blue:#1F4FD1; --blue-soft:#E3EAFB;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --c-com:#E4572E; --c-adm:#1F4FD1; --c-ene:#E0A100; --c-fus:#8A5A2B; --c-qui:#12957A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1526; --paper:#16213A; --ink:#EEF2FA; --muted:#A3AEC4; --line:#2A3858;
  --accent:#F7C531; --accent-ink:#14213D; --blue:#7FA2FF; --blue-soft:#1E2C4E;
  --c-com:#FF7A55; --c-adm:#7FA2FF; --c-ene:#F7C531; --c-fus:#D19A62; --c-qui:#3CCBA6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1526; --paper:#16213A; --ink:#EEF2FA; --muted:#A3AEC4; --line:#2A3858;
  --accent:#F7C531; --accent-ink:#14213D; --blue:#7FA2FF; --blue-soft:#1E2C4E;
  --c-com:#FF7A55; --c-adm:#7FA2FF; --c-ene:#F7C531; --c-fus:#D19A62; --c-qui:#3CCBA6; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-inline:16px;padding-block:20px 32px;margin:0}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand .mark{width:34px;height:34px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.chip{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:99px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,36px);
  box-shadow:0 1px 0 var(--line), 0 18px 40px -28px rgba(20,33,61,.35)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(34px,7vw,58px);line-height:1.02;font-weight:800}
h2{font-size:clamp(24px,4.6vw,34px);line-height:1.12;font-weight:700}
h3{font-size:19px;font-weight:700}
p{margin:0;max-width:62ch}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hl{background:linear-gradient(transparent 58%, var(--accent) 58%, var(--accent) 92%, transparent 92%);padding-inline:2px}
.stack{display:flex;flex-direction:column;gap:16px}

.ruler{position:relative;height:30px}
.ruler svg{width:100%;height:100%;display:block}
.ruler .fill{position:absolute;left:0;top:0;height:10px;background:var(--accent);border-radius:0 3px 3px 0;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.ruler-meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:14px;align-items:center;min-height:70px;
  padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);font-weight:500;line-height:1.3;
  transition:transform .12s, border-color .12s, background .12s}
.opt:hover{border-color:var(--blue);background:var(--blue-soft)}
.opt:active{transform:scale(.98)}
.opt:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:24px}
.opt.picked{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.opt.picked .ic{background:rgba(255,255,255,.55)}

.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:56px;padding:0 26px;border-radius:99px;font-family:var(--f-display);font-weight:700;font-size:19px;
  background:var(--ink);color:var(--bg);transition:transform .12s;text-align:center}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{min-height:44px;font-size:15px;padding:0 18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.hero{display:grid;gap:22px}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap}
.hero-stats span{font-family:var(--f-mono);font-size:13px;padding:6px 12px;border-radius:8px;background:var(--bg)}
.families{display:flex;flex-wrap:wrap;gap:8px 14px}
.fam-dot{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.fam-dot i{width:10px;height:10px;border-radius:50%;display:inline-block}

.fact{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fact .eyebrow{color:var(--accent)}
.fact h2{color:var(--bg)}
.fact p{color:var(--bg);opacity:.85}
.fact .btn{background:var(--accent);color:var(--accent-ink)}
.bignum{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,14vw,110px);line-height:.9;color:var(--accent)}

.res-head{display:grid;gap:12px;border-top:10px solid var(--famc, var(--accent));padding-top:22px}
.match{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.cicles{display:grid;gap:10px}
.cicle{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.cicle .lvl{flex:none;font-family:var(--f-mono);font-size:12px;font-weight:500;padding:4px 8px;border-radius:6px;background:var(--bg);min-width:64px;text-align:center}
.cicle .lvl.gs{background:var(--ink);color:var(--bg)}
.cicle b{font-weight:600;min-width:0}
.jobs{display:flex;flex-wrap:wrap;gap:8px}
.jobs span{font-size:14px;padding:6px 12px;border-radius:99px;border:1px solid var(--line)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,170px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:6px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar .pc{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.bar .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* per què aquí */
.why{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:clamp(18px,3.5vw,28px);display:grid;gap:12px}
.why .eyebrow{color:var(--accent-ink);opacity:.75}
.why h2{font-size:clamp(22px,4.2vw,30px)}
.why p{font-size:16px}
.why .num{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,10vw,72px);line-height:.9}
.plus{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.plus div{background:var(--bg);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.plus b{font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.plus span{font-size:14px;color:var(--muted);line-height:1.35}

.ctas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.cta{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.cta .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cta p{font-size:15px}
.cta a{color:var(--ink)}
.foot{font-size:13px;color:var(--muted);text-align:center}
.foot a{color:inherit}

.screen{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.screen{animation:none}.ruler .fill,.bar .track i{transition:none}}
@media (max-width:480px){.bar{grid-template-columns:minmax(0,110px) 1fr 40px}.btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark">ET</span><div>Escola del Treball<small>Lleida · Formació Professional</small></div></div>
    <span class="chip" id="chip">Test d'orientació · 2 min</span>
  </header>

  <main id="app" aria-live="polite"></main>

  <p class="foot">INS Escola del Treball · C/ Pi i Margall, 51 · Lleida · <a href="https://www.escoladeltreball.cat/" target="_blank" rel="noopener">escoladeltreball.cat</a></p>
</div>

<script>
/* ============ CONFIGURACIÓ (editeu-ho aquí) ============ */
const CONFIG = {
  // Enganxeu aquí l'URL de l'App web de Google Apps Script (acaba en /exec). Mireu LLEGEIX-ME.md
  sheetsUrl: "https://script.google.com/macros/s/AKfycbwQmj-aWj0W2Njq3pgPD_VD4EDhBXQYxmQ4wOClNpfJL-L3hc4as-hHYkFcVxtpK2cQ/exec",
  web: "escoladeltreball.cat",
  webUrl: "https://www.escoladeltreball.cat/",
  estudisUrl: "https://www.escoladeltreball.cat/en/studies/",
  instagram: "@etlleida",
  instagramUrl: "https://www.instagram.com/etlleida/",
  testUrl: location.href.split("#")[0]   // l'enllaç que es comparteix (la vostra pàgina de GitHub)
};

/* ============ FAMÍLIES, CICLES I MOTIUS ============ */
const FAM = {
  com:{nom:"Comerç i màrqueting", perfil:"Estrateg/a creatiu/va", color:"--c-com",
    desc:"Et mou convèncer, comunicar i fer que les idees arribin a la gent. Les marques, les xarxes i els mercats internacionals són el teu terreny.",
    cicles:[["GM","Activitats comercials"],["GS","Màrqueting i publicitat"],["GS","Comerç internacional"],["GS","Transport i logística"]],
    feines:["Community manager","Tècnic/a de màrqueting","Gestor/a d'exportació","Cap de logística","Comercial"],
    motiu:{num:"+50%", t:"Aprendràs màrqueting dins d'una empresa de veritat.",
      p:"Més de la meitat de l'alumnat de l'Escola del Treball fa FP dual: combines l'aula amb una empresa de Lleida, i amb Erasmus+ pots fer pràctiques a Europa."}},
  adm:{nom:"Administració i gestió", perfil:"Organitzador/a nat/a", color:"--c-adm",
    desc:"Poses ordre on hi ha caos. Números, planificació i persones: ets qui fa que una empresa funcioni de debò per dins.",
    cicles:[["GM","Gestió administrativa"],["GM","Gestió administrativa (àmbit jurídic)"],["GS","Administració i finances"],["GS","Administració i finances (àmbit assegurances)"],["GS","Assistència a la direcció"]],
    feines:["Tècnic/a comptable","Gestor/a de RRHH","Assistent de direcció","Administratiu/va","Gestor/a d'assegurances"],
    motiu:{num:"5", t:"Cinc camins per especialitzar-te, en un sol centre.",
      p:"A l'Escola del Treball pots triar l'àmbit jurídic o el d'assegurances, a més dels cicles generals. I amb la FP dual, fas feina en una empresa real mentre estudies."}},
  ene:{nom:"Electricitat, robòtica i renovables", perfil:"Enginyós/osa del futur", color:"--c-ene",
    desc:"T'agrada entendre com funcionen les màquines i fer-les anar millor. Robots, automatismes i energia neta: la transició energètica necessita gent com tu.",
    cicles:[["GM","Instal·lacions elèctriques i automàtiques"],["GS","Automatització i robòtica industrial"],["GS","Energies renovables"]],
    feines:["Tècnic/a en robòtica","Instal·lador/a fotovoltaic/a","Programador/a de PLC","Tècnic/a de manteniment","Gestor/a energètic/a"],
    motiu:{num:"2 MW", t:"Estudiaràs al Centre d'Excel·lència en Energies Renovables.",
      p:"L'Escola del Treball ho és des del 2022. Treballa amb un simulador d'aerogenerador de 2 MW i amb projectes d'hidrogen verd: la tecnologia que les empreses busquen ara."}},
  fus:{nom:"Fusta i disseny de moble", perfil:"Creador/a amb les mans", color:"--c-fus",
    desc:"Tens idees i vols veure-les fetes realitat. Dissenyes, mesures i construeixes: del paper a l'objecte que algú farà servir cada dia.",
    cicles:[["GM","Fusteria i moble"],["GS","Disseny i moblament"]],
    feines:["Dissenyador/a de mobiliari","Projectista d'interiors","Fuster/a ebenista","Tècnic/a de producció","Modelista 3D"],
    motiu:{num:"ABP", t:"Del dibuix al moble acabat, per projectes.",
      p:"A l'Escola del Treball aprens amb Aprenentatge Basat en Projectes: dissenyes i construeixes com es fa a l'empresa, i pots continuar del grau mitjà al superior al mateix centre."}},
  qui:{nom:"Química i salut ambiental", perfil:"Investigador/a curiós/osa", color:"--c-qui",
    desc:"Et preguntes el perquè de tot i vols comprovar-ho. Analitzes, mesures i protegeixes la salut de les persones i del medi.",
    cicles:[["GM","Sanitat ambiental aplicada"],["GS","Laboratori d'anàlisi i de control de qualitat"],["GS","Química i salut ambiental"]],
    feines:["Tècnic/a de laboratori","Control de qualitat alimentària","Inspector/a de salut pública","Tècnic/a ambiental","Analista d'aigües"],
    motiu:{num:"3", t:"Tres cicles per arribar al laboratori, en un sol centre.",
      p:"Pots començar pel grau mitjà i continuar al superior sense canviar d'escola. I amb la FP dual fas pràctiques en empreses i laboratoris de Lleida mentre estudies."}}
};
const ORDRE = ["com","adm","ene","fus","qui"];
const PLUS = [["1932","anys formant professionals a Lleida"],["+1.000","alumnes al centre"],["Erasmus+","pràctiques a Europa"]];

/* ============ PREGUNTES ============ */
const Q = [
  {t:"És dissabte i tens tot el dia lliure. Què et ve més de gust?", o:[
    ["🛠️","Arreglar o muntar alguna cosa amb les mans",{fus:2,ene:1}],
    ["📱","Crear contingut i veure com reacciona la gent",{com:2}],
    ["🧪","Provar una recepta o un experiment nou",{qui:2}],
    ["🗓️","Organitzar un pla perfecte amb els amics",{adm:2,com:1}]]},
  {t:"En un treball en grup, quin paper acabes fent sempre?", o:[
    ["📊","Porto el calendari, les tasques i els números",{adm:2}],
    ["🎤","Presento i convenço la resta",{com:2}],
    ["🔌","Soluciono el problema tècnic que ningú entén",{ene:2}],
    ["✏️","Dibuixo, dissenyo i dono forma a la idea",{fus:2}]]},
  {t:"Tria una eina per passar-te-la a la butxaca:", o:[
    ["🔬","Una lupa amb llum",{qui:2}],
    ["📐","Un regle i un llapis de fuster",{fus:2}],
    ["🧮","Una calculadora",{adm:2}],
    ["🪛","Un tornavís multipunta",{ene:2}]]},
  {t:"Quin titular llegiries primer?", o:[
    ["☀️","«Lleida instal·la el parc solar més gran de la comarca»",{ene:2,qui:1}],
    ["🌍","«Una empresa de Ponent triomfa exportant a Japó»",{com:2,adm:1}],
    ["💧","«Nou mètode per detectar contaminants a l'aigua»",{qui:2}],
    ["🪑","«La cadira dissenyada a Lleida que guanya un premi»",{fus:2}]]},
  {t:"Quin superpoder triaries?", o:[
    ["🤖","Parlar amb les màquines",{ene:2}],
    ["🧠","Saber sempre on va cada euro",{adm:2}],
    ["✨","Fer que tothom vulgui el que venc",{com:2}],
    ["🧬","Veure el que és invisible a ull nu",{qui:2}]]},
  {t:"On et veus treballant d'aquí a 5 anys?", o:[
    ["🏭","En una planta industrial plena de robots",{ene:2}],
    ["🏢","En una oficina coordinant equips",{adm:2,com:1}],
    ["🥼","En un laboratori amb bata blanca",{qui:2}],
    ["🪚","En un taller o estudi de disseny",{fus:2}]]},
  {t:"Última! Com aprens millor?", o:[
    ["🧩","Fent projectes reals amb un equip",{com:1,fus:1,ene:1}],
    ["📋","Amb passos clars i ordenats",{adm:1,qui:1}],
    ["🔧","Tocant, provant i equivocant-me",{ene:1,fus:1}],
    ["🔎","Investigant fins entendre-ho del tot",{qui:1,adm:1}]]}
];

/* ============ PANTALLES "SABIES QUE…?" (després de la pregunta n) ============ */
const FACTS = {
  2:{big:"1932", eyebrow:"Sabies que…?", t:"L'Escola del Treball de Lleida forma professionals des de fa més de 90 anys.",
     p:"Avui hi estudien més de 1.000 alumnes en 17 cicles formatius, de grau mitjà i de grau superior.", cta:"Continua"},
  4:{big:"ABP", eyebrow:"Aprendre fent", t:"Aquí aprens com es treballa de veritat: per projectes.",
     p:"Molts cicles funcionen amb Aprenentatge Basat en Projectes: reptes reals, en equip, com a l'empresa.", cta:"Queden 3 preguntes"},
  6:{big:"⚡", eyebrow:"Centre d'Excel·lència", t:"Des del 2022, l'Escola del Treball és Centre d'Excel·lència en Energies Renovables.",
     p:"Hi treballen amb un simulador d'aerogenerador i projectes d'hidrogen verd.", cta:"Veure el meu resultat"}
};

/* ============ ESTAT ============ */
const app = document.getElementById("app");
let i = 0, score = {}, answers = [], history = [], started = 0;
const sessio = Math.random().toString(36).slice(2,8).toUpperCase();
function reset(){ i = 0; score = {com:0,adm:0,ene:0,fus:0,qui:0}; answers = []; history = []; started = Date.now(); }
reset();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ruler(){
  const pct = Math.round(i / Q.length * 100);
  let ticks = "";
  for(let k=0;k<=100;k+=2){ const h = k%10===0?22:9; ticks += `<line x1="${k}%" x2="${k}%" y1="0" y2="${h}" stroke="var(--line)" stroke-width="1"/>`; }
  return `<div class="ruler" aria-hidden="true"><svg preserveAspectRatio="none">${ticks}</svg><div class="fill" style="width:${pct}%"></div></div>
  <div class="ruler-meta"><span>Pregunta ${i+1} de ${Q.length}</span><span>${pct} mm / 100</span></div>`;
}

function renderStart(){
  document.getElementById("chip").textContent = "Test d'orientació · 2 min";
  app.innerHTML = `<section class="card screen hero">
    <span class="eyebrow">Test exprés de 7 preguntes</span>
    <h1>Quin cicle<br>és <span class="hl">el teu</span>?</h1>
    <p>Respon sense pensar-hi massa. En dos minuts et diem quin perfil professional encaixa amb tu i quins estudis de l'Escola del Treball de Lleida et poden obrir la porta.</p>
    <div class="families">${ORDRE.map(k=>`<span class="fam-dot"><i style="background:var(${FAM[k].color})"></i>${FAM[k].nom}</span>`).join("")}</div>
    <div class="row"><button class="btn accent" id="go">Comença el test →</button><span class="hero-stats"><span>7 preguntes</span><span>0 respostes dolentes</span></span></div>
  </section>`;
  document.getElementById("go").onclick = () => { reset(); renderQ(); };
}

function renderQ(){
  const q = Q[i];
  document.getElementById("chip").textContent = `${i+1}/${Q.length}`;
  app.innerHTML = `<section class="card screen stack">
    ${ruler()}
    <h2>${q.t}</h2>
    <div class="opts">${q.o.map((o,n)=>`<button class="opt" data-n="${n}" id="opt-${i}-${n}"><span class="ic" aria-hidden="true">${o[0]}</span><span>${o[1]}</span></button>`).join("")}</div>
    ${i>0?`<div class="row"><button class="btn ghost small" id="back">← Enrere</button></div>`:""}
  </section>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.n, b));
  const back = document.getElementById("back"); if(back) back.onclick = undo;
  window.scrollTo({top:0});
}

function pick(n, el){
  app.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  el.classList.add("picked");
  const pts = Q[i].o[n][2];
  history[i] = pts; answers[i] = Q[i].o[n][1];
  for(const k in pts) score[k] += pts[k];
  setTimeout(()=>{
    const done = i; i++;
    if(FACTS[done]) renderFact(FACTS[done]);
    else if(i < Q.length) renderQ();
    else renderResult();
  }, 300);
}
function undo(){
  i--; const pts = history[i]; if(pts) for(const k in pts) score[k] -= pts[k];
  renderQ();
}

function renderFact(f){
  app.innerHTML = `<section class="card fact screen stack">
    <span class="eyebrow">${f.eyebrow}</span>
    <div class="bignum" aria-hidden="true">${f.big}</div>
    <h2>${f.t}</h2>
    <p>${f.p}</p>
    <div class="row"><button class="btn" id="next">${f.cta} →</button></div>
  </section>`;
  document.getElementById("next").onclick = () => i < Q.length ? renderQ() : renderResult();
  window.scrollTo({top:0});
}

/* ============ ENVIAMENT A GOOGLE SHEETS ============ */
function sendResult(ranked){
  if(!CONFIG.sheetsUrl) return;
  const pct = Object.fromEntries(ranked);
  const data = {
    sessio,
    perfil: FAM[ranked[0][0]].perfil,
    familia: FAM[ranked[0][0]].nom,
    afinitat: ranked[0][1],
    segona: FAM[ranked[1][0]].nom,
    com: pct.com, adm: pct.adm, ene: pct.ene, fus: pct.fus, qui: pct.qui,
    respostes: answers,
    segons: Math.round((Date.now()-started)/1000),
    dispositiu: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? "Mòbil" : "Ordinador"
  };
  try{
    fetch(CONFIG.sheetsUrl, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(data)}).catch(()=>{});
  }catch(e){}
}

function renderResult(){
  const total = Object.values(score).reduce((a,b)=>a+b,0) || 1;
  const ranked = ORDRE.map(k=>[k, Math.round(score[k]/total*100)]).sort((a,b)=>b[1]-a[1]);
  const [top, topPct] = ranked[0]; const f = FAM[top]; const second = FAM[ranked[1][0]];
  const shareTxt = `He fet el test de l'Escola del Treball de Lleida i em surt «${f.perfil}» (${f.nom}). I a tu, què et surt? ${CONFIG.testUrl}`;
  document.getElementById("chip").textContent = "Resultat";
  sendResult(ranked);

  app.innerHTML = `<section class="card screen stack" style="--famc:var(${f.color})">
    <div class="res-head">
      <span class="eyebrow">El teu perfil</span>
      <h1 style="font-size:clamp(32px,6.5vw,52px)">${f.perfil}</h1>
      <p class="match"><b>${topPct}%</b> d'afinitat amb <b>${f.nom}</b></p>
      <p>${f.desc}</p>
    </div>

    <div class="stack" style="gap:10px">
      <h3>Cicles que et recomanem a l'Escola del Treball</h3>
      <div class="cicles">${f.cicles.map(c=>`<div class="cicle"><span class="lvl ${c[0]==="GS"?"gs":""}">${c[0]==="GS"?"G. Superior":"G. Mitjà"}</span><b>${c[1]}</b></div>`).join("")}</div>
    </div>

    <div class="why">
      <span class="eyebrow">Per què estudiar-ho a l'Escola del Treball?</span>
      <div class="num" aria-hidden="true">${f.motiu.num}</div>
      <h2>${f.motiu.t}</h2>
      <p>${f.motiu.p}</p>
    </div>

    <div class="plus">${PLUS.map(p=>`<div><b>${p[0]}</b><span>${p[1]}</span></div>`).join("")}</div>

    <div class="stack" style="gap:10px">
      <h3>De què podries treballar</h3>
      <div class="jobs">${f.feines.map(j=>`<span>${j}</span>`).join("")}</div>
    </div>

    <div class="stack" style="gap:10px">
      <h3>El teu mapa complet</h3>
      <div class="bars">${ranked.map(([k,p])=>`<div class="bar"><span class="nm">${FAM[k].nom}</span><span class="track"><i data-w="${p}" style="background:var(${FAM[k].color})"></i></span><span class="pc">${p}%</span></div>`).join("")}</div>
      <p style="font-size:14px;color:var(--muted)">Segona opció: <b>${second.nom}</b>. Molta gent combina interessos: pregunta-ho a l'estand.</p>
    </div>

    <div class="ctas">
      <div class="cta"><span class="k">Repta un amic</span><p>Coneixes algú que encara no sap què estudiar? Envia-li el test i compareu resultats.</p>
        <a class="btn accent small" id="share" href="https://wa.me/?text=${encodeURIComponent(shareTxt)}" target="_blank" rel="noopener">Comparteix el test</a></div>
      <div class="cta"><span class="k">Guarda el resultat</span><p>Fes una captura i penja-la etiquetant <b>${CONFIG.instagram}</b>. Així no oblides el teu cicle.</p>
        <a class="btn ghost small" href="${CONFIG.instagramUrl}" target="_blank" rel="noopener">Segueix ${CONFIG.instagram}</a></div>
      <div class="cta"><span class="k">Més informació</span><p>Horaris, dates de preinscripció i tots els detalls de cada cicle.</p>
        <a class="btn ghost small" href="${CONFIG.estudisUrl}" target="_blank" rel="noopener">Veure els estudis</a></div>
    </div>

    <div class="row"><button class="btn ghost small" id="again">Torna a fer el test</button></div>
  </section>`;

  requestAnimationFrame(()=>app.querySelectorAll(".track i").forEach(el=>el.style.width=el.dataset.w+"%"));
  document.getElementById("again").onclick = renderStart;
  const sh = document.getElementById("share");
  sh.addEventListener("click", ev => {
    if(navigator.share){
      ev.preventDefault();
      navigator.share({title:"Quin cicle és el teu?", text:shareTxt.replace(" "+CONFIG.testUrl,""), url:CONFIG.testUrl}).catch(()=>{});
    }
  });
  window.scrollTo({top:0});
}

renderStart();
</script>
</body>
</html>
